

name: Update Housho Rates

on:

  schedule:

    - cron: '*/5 * * * *'

  workflow_dispatch:

permissions:

  contents: write

concurrency:

  group: update-housho-rates

  cancel-in-progress: false

jobs:

  update-rates:

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:

      - name: Checkout repository

        uses: actions/checkout@v4

        with:

          ref: main

          persist-credentials: true

      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: '3.11'

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          python -m pip install requests beautifulsoup4

      - name: Fetch Housho rates

        run: |

          python fetch_rates.py

      - name: Validate downloaded rates

        run: |

          python - <<'PY'

          import json

          from pathlib import Path

          path = Path("rates.json")

          data = json.loads(path.read_text(encoding="utf-8"))

          assert data.get("published_at"), "Publication date missing"

          assert data.get("checked_at"), "Check date missing"

          rates = data.get("rates")

          assert isinstance(rates, dict), "Rates missing"

          assert len(rates) == 37, "Expected 37 grades"

          for grade, price in rates.items():

              assert isinstance(price, int), f"Invalid price: {grade}"

              assert 1 <= price <= 100000, f"Out-of-range price: {grade}"

          print("Validated 37 grades")

          print("Published:", data["published_at"])

          print("Checked:", data["checked_at"])

          PY

      - name: Commit updated rates

        shell: bash

        run: |

          set -euo pipefail

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add rates.json

          if git diff --cached --quiet; then

            echo "No rate changes"

            exit 0

          fi

          git commit -m "Update Housho rates"

          for attempt in 1 2 3; do

            if git push origin HEAD:main; then

              echo "Rates pushed successfully"

              exit 0

            fi

            echo "Push attempt $attempt failed"

            sleep 5

          done

          echo "Failed to push rates"

          exit 1
